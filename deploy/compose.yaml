# Visual YouTube Notes -- single-host Docker Compose stack.
#
# Decisions and their reasoning: docs/adr/0008-deployment-topology.md
# Operational procedures: see ticket #21 (runbook).
#
# Seven services. No two of them share a volume: the backup sidecar reaches
# PostgreSQL over the network with pg_dump, and Gotenberg receives HTML over
# HTTP, so nothing contends for a filesystem and any one service can be
# rebuilt alone.
#
# On the OCI host this file only ever pulls: images are built by CI and pushed
# to GHCR, and the host runs `docker compose pull && docker compose up -d`.
# The `build:` blocks exist so local development can still `docker compose
# build` from a checkout; the host never does.

name: visual-youtube-notes

x-logging: &logging
  # The `local` driver rotates by default; json-file does not unless BOTH
  # max-size and max-file are set, and max-file alone silently does nothing.
  # Bounds are stated here anyway rather than inherited from a default.
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: vyn
      POSTGRES_USER: vyn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Starting values for an 8 GB ceiling, not a tuned answer. Hybrid search
    # (ADR 0005) does exact vector scans, so it leans on shared_buffers and
    # the OS cache rather than on an index.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyn -d vyn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G

  # ---------------------------------------------------------------------------
  # Schema migrations -- two one-shots from one image, gating everything that
  # touches the database. River owns River's schema; we own ours. See ADR 0009.
  #
  # The migration files live INSIDE the image rather than on a bind mount, so
  # the schema version travels with the tag exactly as the PWA does. The cost is
  # that a rolled-back image carries fewer migrations than the database has
  # applied -- which the entrypoint recognises as the defined outcome of a
  # rollback and exits 0 for, instead of failing and stranding the stack.
  # ---------------------------------------------------------------------------
  river-migrate:
    image: ghcr.io/max-786/visual-youtube-notes/migrate:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/migrate/Dockerfile
      args:
        # Must match the `river` dependency in backend/go.mod; CI derives it
        # from there rather than pinning the schema and the library twice.
        RIVER_VERSION: ${RIVER_VERSION:?set RIVER_VERSION from backend/go.mod}
    # Must stay `no`: service_completed_successfully waits for an exited
    # container and reads its code, so a restarting container never settles.
    restart: "no"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: vyn
      PGUSER: vyn
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command: ["river"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    image: ghcr.io/max-786/visual-youtube-notes/migrate:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/migrate/Dockerfile
      args:
        RIVER_VERSION: ${RIVER_VERSION:?set RIVER_VERSION from backend/go.mod}
    restart: "no"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      river-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: vyn
      PGUSER: vyn
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # golang-migrate skips any file failing its {version}_{title}.{up|down}.{ext}
    # regex, so the repo's *.test.sql siblings are ignored rather than misread.
    # Never name one *.up.test.sql -- that DOES match, as a duplicate `up`, and
    # fails the whole run. See the CI guard in ADR 0008.
    command: ["app"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/max-786/visual-youtube-notes/api:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/api/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      VYN_DATABASE_HOST: postgres
      VYN_DATABASE_NAME: vyn
      VYN_DATABASE_USER: vyn
      VYN_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      VYN_MASTER_KEY_FILE: /run/secrets/master_key
      VYN_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      VYN_PUBLIC_ORIGIN: https://yt-track.mkhismkh.com
      VYN_LISTEN: ":8080"
      # SSE comment heartbeat, comfortably inside Cloudflare's documented
      # 125 s Proxy Read Timeout (which has no free-plan override).
      VYN_SSE_HEARTBEAT: 30s
    secrets:
      - postgres_password
      - master_key
      - vapid_private_key
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Worker -- yt-dlp, Deno and FFmpeg live here and nowhere else
  # ---------------------------------------------------------------------------
  worker:
    # Second tag names the yt-dlp CalVer, so a yt-dlp rollback is a tag change
    # rather than a rebuild (ticket #4: pin, never self-update).
    image: ghcr.io/max-786/visual-youtube-notes/worker:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/worker/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    environment:
      VYN_DATABASE_HOST: postgres
      VYN_DATABASE_NAME: vyn
      VYN_DATABASE_USER: vyn
      VYN_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      VYN_MASTER_KEY_FILE: /run/secrets/master_key
      VYN_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      VYN_GOTENBERG_URL: http://gotenberg:3000
      # /status, not /healthz: liveness and staleness are different questions,
      # and the health check owns the other one. See ADR 0009.
      VYN_BACKUP_STATUS_URL: http://backup:8080/status
      # Staleness thresholds. The off-server copy is weekly to a laptop that is
      # off some nights, so 48 hours would cry wolf every week.
      VYN_BACKUP_STALE_LOCAL: 48h
      VYN_BACKUP_STALE_OFFSITE: 240h
      VYN_HEALTH_CHECK_INTERVAL: 15m
      # Alarm before the transcribing Stage's own preflight floor below, so the
      # warning precedes the failure it predicts rather than explaining it.
      VYN_DISK_MIN_FREE_BYTES: "5368709120"
      VYN_DISK_MIN_FREE_PERCENT: "10"
      VYN_HEALTH_LISTEN: ":8081"
      VYN_TEMP_DIR: /var/lib/vyn/tmp
      # Queue shape is fixed by ADR 0006: FFmpeg and STT are serialised by
      # living alone on the `media` queue, not by a CPU threshold.
      VYN_QUEUE_DEFAULT_WORKERS: "2"
      VYN_QUEUE_MEDIA_WORKERS: "1"
      # Preflight floor for the transcribing Stage. A two-hour job needs about
      # 120 MB; the real risk is accumulation when the six-hour sweep fails.
      VYN_TEMP_MIN_FREE_BYTES: "2147483648"
      YTDLP_CACHE_DIR: /var/cache/yt-dlp
    secrets:
      - postgres_password
      - master_key
      - vapid_private_key
    volumes:
      - worker_tmp:/var/lib/vyn/tmp
      - ytdlp_cache:/var/cache/yt-dlp
    healthcheck:
      # The worker serves this on an internal port only, never through Caddy.
      # A heartbeat file would prove the process is scheduled; it would not
      # notice a wedged pool or a River client that stopped consuming.
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:8081/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G

  # ---------------------------------------------------------------------------
  # PDF rendering -- Chromium, kept out of the worker image
  # ---------------------------------------------------------------------------
  gotenberg:
    # Pinned to an exact patch, never the floating `8-chromium`: the font set
    # was cut from 30+ packages to 8 at 8.30, and Devanagari rides on
    # fonts-noto-core. Verified present in this digest:
    #   NotoSansDevanagari-{Regular,Bold}.ttf, NotoSerifDevanagari-{Regular,Bold}.ttf
    image: gotenberg/gotenberg:8.36.0-chromium@sha256:a40f92d7419adbf98fd2ab2e4211f6186c9fd44f196a5aadbd2769bf237faae6
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # The image ships no HEALTHCHECK of its own, so it is declared here.
      # curl is present at /usr/bin/curl; wget is not.
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Edge -- TLS, static PWA, reverse proxy
  # ---------------------------------------------------------------------------
  caddy:
    image: ghcr.io/max-786/visual-youtube-notes/caddy:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/caddy/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Backups -- restic, on its own schedule
  # ---------------------------------------------------------------------------
  backup:
    image: ghcr.io/max-786/visual-youtube-notes/backup:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/images/backup/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: vyn
      PGUSER: vyn
      # Not PGPASSFILE: that wants a pgpass-format line (host:port:db:user:pw),
      # and the secret is a bare password. lib.sh reads the file and exports
      # PGPASSWORD inside the script, so it never enters `docker inspect`.
      PGPASSWORD_FILE: /run/secrets/postgres_password
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_LOCAL_REPO: /var/lib/restic
      # Off-server copy target; the identity is a mounted secret. Its repository
      # carries its OWN password, so a compromise of this host does not hand
      # over the laptop copy once that one is rotated.
      RESTIC_SFTP_REPO: ${RESTIC_SFTP_REPO:-}
      RESTIC_SFTP_PASSWORD_FILE: /run/secrets/restic_sftp_password
      # A PUBLIC age recipient, so environment is the honest place for it: ADR
      # 0008 keeps secrets in files because environment leaks, and a leaked
      # public key is a non-event. The matching private identity lives only in
      # the Owner's password manager and has never been on this host.
      BACKUP_RECOVERY_RECIPIENT: ${BACKUP_RECOVERY_RECIPIENT:?set the age recovery recipient}
      KEEP_DAILY: "7"
      KEEP_WEEKLY: "4"
      STATUS_LISTEN_PORT: "8080"
    # The schedule is baked into the image at /etc/vyn/crontab rather than
    # passed in, so `docker compose up` cannot bring up a backup service whose
    # timings disagree with the scripts it is running.
    secrets:
      - postgres_password
      - restic_password
      - restic_sftp_key
      - restic_sftp_password
      - master_key
      - vapid_private_key
    volumes:
      - restic_local:/var/lib/restic
      - backup_state:/var/lib/vyn-backup
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://localhost:8080/healthz",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Restore drill -- a scratch database beside production, never in the default
  # `up`. Shipped rather than improvised at drill time so the scratch instance
  # is guaranteed the same major and the same pgvector build as production,
  # which is exactly what a tired person typing `docker run` gets wrong.
  #
  #   docker compose --profile restore up -d db-restore
  # ---------------------------------------------------------------------------
  db-restore:
    profiles: ["restore"]
    image: pgvector/pgvector:pg17
    restart: "no"
    logging: *logging
    environment:
      POSTGRES_DB: vyn
      POSTGRES_USER: vyn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata_restore:/var/lib/postgresql/data
    # No ports. The drill reaches it over the Compose network, and a scratch
    # database holding a full copy of the library should not be one firewall
    # rule away from the internet.
    command:
      - postgres
      - -c
      # A parallel pg_restore rebuilds every index, HNSW included. This is the
      # scratch instance, so it can take memory production would not give it.
      - maintenance_work_mem=2GB
      - -c
      - max_parallel_maintenance_workers=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyn -d vyn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ytdlp_cache:
  worker_tmp:
  restic_local:
  backup_state:
  # Only ever populated under the `restore` profile; dropped after each drill.
  pgdata_restore:

secrets:
  # Files, never environment: env leaks into `docker inspect` and into every
  # child process, and the worker spawns yt-dlp, Deno and FFmpeg constantly.
  postgres_password:
    file: ./secrets/postgres_password
  master_key:
    file: ./secrets/master_key
  restic_password:
    file: ./secrets/restic_password
  restic_sftp_key:
    file: ./secrets/restic_sftp_key
  # Deliberately a different value from restic_password: the off-server copy
  # should survive a compromise of this host's secrets once rotated.
  restic_sftp_password:
    file: ./secrets/restic_sftp_password
  vapid_private_key:
    file: ./secrets/vapid_private_key
