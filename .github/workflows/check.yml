name: Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:race
      - run: pnpm generate
      - run: git diff --exit-code
      - run: pnpm build
      - run: pnpm --filter @visual-notes/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Applies every migration and .test.sql in a pgvector/pg17 container,
      # then reverses the whole chain. See scripts/verify-migrations.sh.
      - run: sh scripts/verify-migrations.sh
