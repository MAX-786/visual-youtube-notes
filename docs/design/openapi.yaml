  /notes/{noteId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/noteId"
      - $ref: "#/components/parameters/revisionId"
    post:
      tags: [notes]
      operationId: restoreRevision

      x-rate-limit: mutation
      summary: Restore a past Revision
      description: |
        Copies the named Revision's payload into a new `restore` Revision whose parent is the current
