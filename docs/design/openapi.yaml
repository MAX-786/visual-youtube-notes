      x-rate-limit: search
      summary: Hybrid search
      description: |
        Lexical and semantic ranks fused per child, aggregated per Note, 25 per page
        (`docs/design/search-ranking.md`). Filters apply before ranking. When the query embedding
        fails or the Soft cap has paused it, lexical results still return and
        `semantic_unavailable` says why -- the client wording must differ between a fault and a
        budget the Owner chose. The candidate depth caps at roughly 200 Notes; `exhausted` says the
        set ran out rather than the page.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: topic_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: channel_id
          in: query
          schema:
            type: string
        - name: min_duration
          in: query
          description: Seconds, inclusive.
          schema:
            type: integer
            minimum: 0
        - name: max_duration
          in: query
          description: Seconds, inclusive.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/cursor"
      x-error-codes: [invalid_request]
      responses:
