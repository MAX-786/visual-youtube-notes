      tags: [settings]
      operationId: getAiSettings

      x-rate-limit: read
      summary: Processing role configuration
      description: Every role's provider, model, endpoint, request options and key status. Never a key.
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        default:
          $ref: "#/components/responses/Error"

  /settings/ai/{role}:
    parameters:
      - $ref: "#/components/parameters/role"
    put:
      tags: [settings]
      operationId: updateAiRole

      x-rate-limit: admin
      summary: Configure a Processing role
      description: |
        `request_options` are validated against the provider's validator on save and passed through
        unchanged at call time (ADR 0010). `endpoint` must be `https` and may not resolve to a private,
        loopback or link-local address. `api_key` is write-only; omit it to keep the stored key. Any
        change to provider, model, endpoint or key clears `verified_at` and writes an
        `ai_role_changed` security event per changed field.
      x-error-codes:
        [
          invalid_request,
          invalid_request_options,
          endpoint_not_allowed,
          csrf_rejected,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiRoleWrite"
      responses:
        "200":
          description: The role as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoleConfig"
        default:
          $ref: "#/components/responses/Error"

  /settings/ai/{role}/key:
    parameters:
      - $ref: "#/components/parameters/role"
    delete:
      tags: [settings]
      operationId: clearAiRoleKey

      x-rate-limit: admin
      summary: Remove a role's stored key
      description: Leaves the role unconfigured, which for `note_generation` and `embeddings` blocks new Submissions.
      x-error-codes: [not_found, csrf_rejected]
      responses:
        "200":
          description: The role without a key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoleConfig"
        default:
          $ref: "#/components/responses/Error"

  /settings/ai/{role}/verify:
    parameters:
      - $ref: "#/components/parameters/role"
    post:
      tags: [settings]
      operationId: verifyAiRole

      x-rate-limit: admin
      summary: Verify a role's key against its provider
      description: |
        The cheapest authenticated read the provider offers. Where none is free the call is billable
        and writes a ledger row like any other spend; `charged` says which happened. A failure warns
        rather than blocks.
      x-error-codes: [not_found, csrf_rejected]
      responses:
        "200":
          description: The verification outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
        default:
          $ref: "#/components/responses/Error"

  /settings/usage:
    get:
      tags: [settings]
      operationId: getUsage

      x-rate-limit: read
      summary: Monthly AI usage
      description: |
        Month-to-date charged spend beside the three counts it cannot include -- crashed calls,
        calls carrying unpriced units, and calls still running -- so the UI reads the month as "at
        least this much" whenever any is non-zero (ADR 0007).
      parameters:
        - name: month
          in: query
          description: Calendar month in the account timezone, `YYYY-MM`. Defaults to the current month.
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
      x-error-codes: [invalid_request]
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyUsage"
        default:
          $ref: "#/components/responses/Error"

  /settings/cost:
    get:
      tags: [settings]
      operationId: getCostSettings

      x-rate-limit: read
      summary: The Soft cap and semantic override
      responses:
        "200":
          description: Cost settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [settings]
      operationId: updateCostSettings

      x-rate-limit: admin
      summary: Change the Soft cap
      description: Takes effect at the next gate. Holds already placed stay held; raising the cap does not resume them.
      x-error-codes: [invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostSettingsWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSettings"
        default:
          $ref: "#/components/responses/Error"

  /settings/cost/semantic-override:
    post:
      tags: [settings]
      operationId: enableSemanticForMonth

      x-rate-limit: admin
      summary: Re-enable semantic search for the current month
      description: Stamps the override with the current month; it lapses on its own at month end (ADR 0007).
      x-error-codes: [csrf_rejected]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSettings"
        default:
          $ref: "#/components/responses/Error"

  /settings/prices:
    get:
      tags: [settings]
      operationId: listPriceSets

      x-rate-limit: read
      summary: List price sets
      description: Every version of every model's prices, newest first.
      responses:
        "200":
          description: Price sets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSetList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [settings]
      operationId: createPriceSet

      x-rate-limit: admin
      summary: Append a price set version
      description: Never an in-place edit. A correction is a new row with a later `effective_from`; charges already snapshotted are unmoved (ADR 0007).
      x-error-codes: [invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceSetCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSet"
        default:
          $ref: "#/components/responses/Error"

  /settings/search-index:
    get:
      tags: [settings]
      operationId: getSearchIndex

      x-rate-limit: read
      summary: The search index state
      responses:
        "200":
          description: Which model search reads, and any reindex in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchIndexState"
        default:
          $ref: "#/components/responses/Error"

  /settings/search-index/reindex:
    post:
      tags: [settings]
      operationId: startReindex

      x-rate-limit: admin
      summary: Start reindexing into another embedding model
      description: |
        Embeds every child under the new model via the Batch API, alongside the old vectors, which
        stay live. A model whose dimension differs from the column's is refused: that swap is a
        migration (ADR 0005).
      x-error-codes:
        [
          reindex_in_progress,
          dimension_mismatch,
          invalid_request,
          csrf_rejected,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "202":
          description: Reindex started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchIndexState"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [settings]
      operationId: abandonReindex

      x-rate-limit: admin
      summary: Abandon the reindex in progress
      description: Deletes the incoming model's vectors. Costs only the embedding spend already made.
      x-error-codes: [no_reindex_in_progress, csrf_rejected]
      responses:
        "200":
          description: Abandoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchIndexState"
        default:
          $ref: "#/components/responses/Error"

  /settings/search-index/activate:
    post:
      tags: [settings]
      operationId: activateReindex

      x-rate-limit: admin
      summary: Flip search to the reindexed model
      description: Gated on completeness; `reindex_incomplete` carries how many Notes still lack vectors. The old model's rows are deleted after the flip.
      x-error-codes: [no_reindex_in_progress, reindex_incomplete, csrf_rejected]
      responses:
        "200":
          description: Flipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchIndexState"
        default:
          $ref: "#/components/responses/Error"

  /settings/health:
    get:
      tags: [settings]
      operationId: getHealth

      x-rate-limit: read
      summary: Operational health
      description: |
        Every `system_health` row with `unknown` computed by the reader when `checked_at` is older
        than three times the check's cadence (ADR 0009), the restore drill history, and the count of
        Notes blocked by extractor breakage.
      responses:
        "200":
          description: The health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        default:
          $ref: "#/components/responses/Error"

  /settings/health/drills:
    post:
      tags: [settings]
      operationId: recordRestoreDrill

      x-rate-limit: admin
      summary: Record a completed restore drill
      description: Append-only. `restore_seconds` is the only measured RTO this project has.
      x-error-codes: [invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreDrillCreate"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreDrill"
        default:
          $ref: "#/components/responses/Error"

  /settings/health/retry-blocked:
    post:
      tags: [settings]
      operationId: retryBlockedNotes

      x-rate-limit: run
      summary: Retry every Note blocked by extractor breakage
      description: The last step of the yt-dlp update procedure, selecting on `notes_blocked_by_tooling`. Each Note starts a new run at its failed Stage.
      x-error-codes: [roles_unconfigured, csrf_rejected]
      responses:
        "200":
          description: What was retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryBlockedResult"
        default:
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # /events -- live updates (ADR 0012)
  # ---------------------------------------------------------------------------
  /events:
    get:
      tags: [events]
      operationId: streamEvents

      x-rate-limit: stream
      summary: The live-update stream
      description: |
        `text/event-stream`, cookie-authenticated, one per browser profile. Excluded from Go code
        generation (see the document description). Frames:

        | `event:`   | `id:`       | `data:`         | Durable |
        | ---------- | ----------- | --------------- | ------- |
        | `sync`     | the cursor  | `SyncEvent`     | yes     |
        | `progress` | **omitted** | `ProgressEvent` | no      |
        | `resync`   | omitted     | `ResyncEvent`   | --      |
        | `revoked`  | omitted     | `RevokedEvent`  | --      |

        A `:` comment heartbeat goes out every 30 seconds; the Device session is re-verified on each
        one and the stream closes with `revoked` when it is gone. `retry: 5000` is sent once on
        connect. Resume with `Last-Event-ID` (the browser does this itself) or `cursor` on a cold
        start; a cursor older than the thirty-day outbox floor gets `resync`.
      parameters:
        - name: cursor
          in: query
          description: Cold-start resume point. Ignored when `Last-Event-ID` is present.
          schema:
            $ref: "#/components/schemas/SyncCursor"
        - name: Last-Event-ID
          in: header
          schema:
            $ref: "#/components/schemas/SyncCursor"
      x-sse-frames:
        sync: "#/components/schemas/SyncEvent"
        progress: "#/components/schemas/ProgressEvent"
        resync: "#/components/schemas/ResyncEvent"
        revoked: "#/components/schemas/RevokedEvent"
      x-error-codes: [unauthenticated]
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /events/since:
    get:
      tags: [events]
      operationId: listEventsSince

      x-rate-limit: read
      summary: Polling fallback
      description: |
        The same payloads as `sync` frames, batched in cursor order. Progress is not in the outbox, so
        a poller also refetches in-flight Notes. `resync_required` is true when the cursor predates
        the retention floor; the client then rebuilds `notes`, `transcripts` and `topics` and never
        touches its queues.
      parameters:
        - name: cursor
          in: query
          required: true
          description: The last cursor the client has applied. 0 on first sign-in.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      x-error-codes: [invalid_request]
      responses:
        "200":
          description: Events after the cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsSince"
        default:
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # /push (ADR 0014)
  # ---------------------------------------------------------------------------
  /push/vapid-public-key:
    get:
      tags: [push]
      operationId: getVapidPublicKey

      x-rate-limit: read
      summary: The VAPID public key
      description: Derived at boot from the mounted private key and served rather than baked into the bundle, which CI builds before the key exists.
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        default:
          $ref: "#/components/responses/Error"

  /push-subscriptions:
    get:
      tags: [push]
      operationId: listPushSubscriptions

      x-rate-limit: read
      summary: List this Owner's push subscriptions
      responses:
        "200":
          description: Every subscription, with the device it belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [push]
      operationId: upsertPushSubscription

      x-rate-limit: admin
      summary: Register or replace this device's subscription
      description: |
        Keyed by endpoint, which is the subscription's identity. Bound to the calling PWA Device
        session so revocation removes it by cascade; an extension session is refused. On
        `pushsubscriptionchange` the service worker posts the new subscription with
        `replaces_endpoint` set to the old one, so the row is swapped rather than duplicated.
      x-error-codes: [invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionWrite"
      responses:
        "200":
          description: The stored subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        default:
          $ref: "#/components/responses/Error"

  /push-subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/subscriptionId"
    patch:
      tags: [push]
      operationId: updatePushSubscription

      x-rate-limit: admin
      summary: Toggle note or ops notifications
      x-error-codes: [not_found, invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [push]
      operationId: deletePushSubscription

      x-rate-limit: admin
      summary: Remove a subscription
      x-error-codes: [not_found, csrf_rejected]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-vyn_access
      description: |
        The PWA's access cookie (ADR 0003). Every non-GET request under this scheme must also carry
        `X-CSRF-Token` matching the session's token, an exact `Origin` of the app origin, and a JSON
        content type; a miss answers `csrf_rejected` or `origin_rejected`. The refresh cookie
        `__Secure-vyn_refresh` is scoped to `/auth/refresh` and is never sent elsewhere.
    extensionBearer:
      type: http
      scheme: bearer
      description: |
        The extension's access token, sent only to the app origin and only by its service worker
        (ADR 0013). Valid on operations marked `x-extension-callable: true` and on no others. A
        request that also carries a session cookie is rejected with `mixed_transport`.

  parameters:
    noteId:
      name: noteId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    revisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    topicId:
      name: topicId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    tagId:
      name: tagId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    requestId:
      name: requestId
      in: path
      required: true
      description: The public Pairing request id, 43 base64url characters.
      schema:
        $ref: "#/components/schemas/Base64Url256"
    role:
      name: role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AiRole"
    cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 256
    exportTranscript:
      name: transcript
      in: query
      description: Include the Transcript. Defaults off, matching spec 12's default contents.
      schema:
        type: boolean
        default: false
    exportRevision:
      name: revision
      in: query
      description: Render this Revision instead of the Active Revision. Must belong to the Note.
      schema:
        $ref: "#/components/schemas/Uuid"

  responses:
    Error:
      description: |
        Any non-2xx outcome. The HTTP status is fixed per `code`; see `ErrorCode`. A `429` also carries
        `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait. Present only on `429`.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # -- primitives -----------------------------------------------------------
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Money:
      type: string
      pattern: "^\\d+(\\.\\d{1,12})?$"
      description: USD as a decimal string. Never a float, because the ledger is `numeric(16,10)`.
    SyncCursor:
      type: integer
      format: int64
      minimum: 1
      description: A Sync cursor (ADR 0004). Monotonic per Owner; visible in commit order.
    ElementId:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
      description: A stable Content block or Diagram element id.
    VideoId:
      type: string
      pattern: "^[A-Za-z0-9_-]{11}$"
    Base64Url256:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: 32 random or hashed bytes, base64url without padding.
    ExtensionId:
      type: string
      pattern: "^[a-p]{32}$"

    # -- errors ---------------------------------------------------------------
    ErrorCode:
      type: string
      description: |
        The closed set of typed reasons. HTTP status and the keys `details` carries, per code:

        | Code | Status | `details` |
        | --- | --- | --- |
        | `invalid_request` | 400 | `field`, `reason` from request validation |
        | `mixed_transport` | 400 | -- |
        | `unauthenticated` | 401 | -- (deliberately uniform, ADR 0003) |
        | `csrf_rejected` | 403 | -- |
        | `origin_rejected` | 403 | -- |
        | `pairing_rejected` | 403 | -- (uniform across mismatch, replay, consumed) |
        | `not_found` | 404 | -- |
        | `note_purged` | 404 | -- (drop the offline queue for this Note) |
        | `note_trashed` | 409 | -- |
        | `note_not_trashed` | 409 | -- |
        | `note_not_ready` | 409 | `processing_state` |
        | `note_not_failed` | 409 | `processing_state` |
        | `run_in_flight` | 409 | `processing_version` |
        | `revision_not_active` | 409 | `active_revision_id` |
        | `revision_not_awaiting_decision` | 409 | -- |
        | `regeneration_in_flight` | 409 | -- |
        | `takeaway_stale` | 409 | `server_text`, `server_cursor` |
        | `roles_unconfigured` | 409 | `roles` (the blocking `AiRole` values) |
        | `no_active_revision` | 409 | `processing_state` |
        | `cost_hold_absent` | 409 | -- |
        | `topic_in_use` | 409 | `note_count` |
        | `topic_exists` | 409 | `topic_id` |
        | `tag_exists` | 409 | `tag_id` |
        | `pairing_not_approved` | 409 | -- (keep polling) |
        | `pairing_decided` | 409 | `status` |
        | `reindex_in_progress` | 409 | `model` |
        | `no_reindex_in_progress` | 409 | -- |
        | `reindex_incomplete` | 409 | `notes_missing` |
        | `dimension_mismatch` | 409 | `model_dimension`, `column_dimension` |
        | `pairing_expired` | 410 | -- |
        | `pairing_denied` | 410 | -- |
        | `mutation_expired` | 410 | -- |
        | `url_unsupported` | 422 | `reason` |
        | `validation_failed` | 422 | `rule`, `element_id` |
        | `invalid_request_options` | 422 | `field`, `reason` |
        | `endpoint_not_allowed` | 422 | `reason` |
        | `rate_limited` | 429 | `class`, `retry_after_seconds` |
        | `internal_error` | 500 | -- |
        | `renderer_unavailable` | 502 | -- |
      enum:
        - invalid_request
        - mixed_transport
        - unauthenticated
        - csrf_rejected
        - origin_rejected
        - pairing_rejected
        - not_found
        - note_purged
        - note_trashed
        - note_not_trashed
        - note_not_ready
        - note_not_failed
        - run_in_flight
        - revision_not_active
        - revision_not_awaiting_decision
        - regeneration_in_flight
        - takeaway_stale
        - roles_unconfigured
        - no_active_revision
        - cost_hold_absent
        - topic_in_use
        - topic_exists
        - tag_exists
        - pairing_not_approved
        - pairing_decided
        - reindex_in_progress
        - no_reindex_in_progress
        - reindex_incomplete
        - dimension_mismatch
        - pairing_expired
        - pairing_denied
        - mutation_expired
        - url_unsupported
        - validation_failed
        - invalid_request_options
        - endpoint_not_allowed
        - rate_limited
        - internal_error
        - renderer_unavailable
    ErrorBody:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: For a person. Names the next available action (spec 15). Never a transcript, a key, or a provider payload.
        details:
          type: object
          additionalProperties: true
          description: Keys fixed per code; see `ErrorCode`.
      required: [code, message]
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required: [error]

    # -- auth -----------------------------------------------------------------
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
        device_name:
          type: string
          maxLength: 80
          description: Shown in Settings. Defaults to a name derived from the user agent.
      required: [username, password]
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
      required: [current_password, new_password]
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          description: The raw session-bound token for `X-CSRF-Token`. Keep in memory only.
      required: [csrf_token]
    Account:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
        timezone:
          type: string
          description: IANA zone name. Groups Save times and fixes billing months.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        password_changed_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        [id, username, display_name, timezone, created_at, password_changed_at]
    AccountUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      minProperties: 1
    DeviceSessionKind:
      type: string
      enum: [pwa, extension]
    DeviceSession:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/DeviceSessionKind"
        display_name:
          type: string
        extension_id:
          type: [string, "null"]
          description: Present for `extension` sessions.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        last_refreshed_at:
          $ref: "#/components/schemas/Timestamp"
        inactive_expires_at:
          $ref: "#/components/schemas/Timestamp"
        is_current:
          type: boolean
          description: Whether this is the session making the request.
        push_subscriptions:
          type: integer
          minimum: 0
          description: Subscriptions bound to this session. Always 0 for an extension.
      required:
        - id
        - kind
        - display_name
        - extension_id
        - created_at
        - last_seen_at
        - last_refreshed_at
        - inactive_expires_at
        - is_current
        - push_subscriptions
    DeviceSessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"
      required: [sessions]
    SessionGrant:
      type: object
      description: What a cookie-transport login, refresh, or password change returns.
      properties:
        session:
          $ref: "#/components/schemas/DeviceSession"
        account:
          $ref: "#/components/schemas/Account"
        csrf_token:
          type: string
        access_expires_at:
          $ref: "#/components/schemas/Timestamp"
        sync_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The server's current cursor. 0 when nothing has ever been written.
      required: [session, account, csrf_token, access_expires_at, sync_cursor]
    SessionInfo:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/DeviceSession"
        account:
          $ref: "#/components/schemas/Account"
        access_expires_at:
          $ref: "#/components/schemas/Timestamp"
        sync_cursor:
          type: integer
          format: int64
          minimum: 0
      required: [session, account, access_expires_at, sync_cursor]
    TokenGrant:
      type: object
      description: What the extension receives from exchange and refresh. The only copy of both tokens.
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_at:
          $ref: "#/components/schemas/Timestamp"
        session:
          $ref: "#/components/schemas/DeviceSession"
      required: [access_token, refresh_token, access_expires_at, session]
    RefreshTokensRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
      required: [refresh_token]

    SecurityEventType:
      type: string
      enum:
        - login_failed
        - refresh_reuse
        - origin_rejected
        - pairing_denied
        - pairing_replay
        - password_changed
        - password_reset
        - session_revoked
        - ai_role_changed
        - rate_limited
    SecurityEvent:
      type: object
      description: Never a credential, a verifier, a password, a request body, or a user agent (ADR 0003).
      properties:
        id:
          type: integer
          format: int64
        event_type:
          $ref: "#/components/schemas/SecurityEventType"
        device_session_id:
          type: [string, "null"]
          format: uuid
        source_ip:
          type: [string, "null"]
        reason_code:
          type: [string, "null"]
          description: A safe code, never a value. For `rate_limited`, the rate-limit class.
        extension_id:
          type: [string, "null"]
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - event_type
        - device_session_id
        - source_ip
        - reason_code
        - extension_id
        - occurred_at
    SecurityEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        next_cursor:
          type: [string, "null"]
      required: [events, next_cursor]

    # -- pairing --------------------------------------------------------------
    PairingRequestCreate:
      type: object
      properties:
        challenge:
          $ref: "#/components/schemas/Base64Url256"
        extension_id:
          $ref: "#/components/schemas/ExtensionId"
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: The browser name shown on the approval page and in Settings.
      required: [challenge, extension_id, display_name]
    PairingRequestCreated:
      type: object
      properties:
        request_id:
          $ref: "#/components/schemas/Base64Url256"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        approval_url:
          type: string
          format: uri
          description: The PWA page to open, `/pair/{requestId}`.
      required: [request_id, expires_at, approval_url]
    PairingRequestStatus:
      type: string
      enum: [pending, approved, denied, expired, consumed]
    PairingRequest:
      type: object
      properties:
        request_id:
          $ref: "#/components/schemas/Base64Url256"
        extension_id:
          $ref: "#/components/schemas/ExtensionId"
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/PairingRequestStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        [request_id, extension_id, display_name, status, created_at, expires_at]
    PairingExchange:
      type: object
      properties:
        request_id:
          $ref: "#/components/schemas/Base64Url256"
        verifier:
          $ref: "#/components/schemas/Base64Url256"
      required: [request_id, verifier]

    # -- submissions ----------------------------------------------------------
    SubmissionRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Any URL form spec 8.1 accepts. A playlist `list` parameter is ignored when `v` is present.
      required: [url]
    SubmissionOutcome:
      type: string
      enum: [created, duplicate, held]
    SubmissionResult:
      oneOf:
        - $ref: "#/components/schemas/SubmissionCreated"
        - $ref: "#/components/schemas/SubmissionDuplicate"
        - $ref: "#/components/schemas/SubmissionHeld"
      discriminator:
        propertyName: outcome
        mapping:
          created: "#/components/schemas/SubmissionCreated"
          duplicate: "#/components/schemas/SubmissionDuplicate"
          held: "#/components/schemas/SubmissionHeld"
    SubmissionCreated:
      type: object
      properties:
        outcome:
          type: string
          enum: [created]
        note:
          $ref: "#/components/schemas/NoteCard"
        undo_until:
          $ref: "#/components/schemas/Timestamp"
      required: [outcome, note, undo_until]
    SubmissionDuplicate:
      type: object
      properties:
        outcome:
          type: string
          enum: [duplicate]
        note:
          $ref: "#/components/schemas/NoteCard"
      required: [outcome, note]
    SubmissionHeld:
      type: object
      properties:
        outcome:
          type: string
          enum: [held]
        note:
          $ref: "#/components/schemas/NoteCard"
        month_charged_usd:
          $ref: "#/components/schemas/Money"
        soft_cap_usd:
          $ref: "#/components/schemas/Money"
      required: [outcome, note, month_charged_usd, soft_cap_usd]
    UndoResult:
      type: object
      properties:
        result:
          type: string
          enum: [undone, trashed]
        note_id:
          $ref: "#/components/schemas/Uuid"
      required: [result, note_id]

    # -- notes ----------------------------------------------------------------
    ProcessingState:
      type: string
      enum:
        - queued
        - metadata
        - captions
        - transcribing
        - generating
        - indexing
        - ready
        - failed
        - cancelling
        - cancelled
    StageKind:
      type: string
      enum: [metadata, captions, transcribing, generating, indexing]
    StageStatus:
      type: string
      enum: [pending, running, ready, failed, skipped, cancelled]
    FailureKind:
      type: string
      description: |
        `input` is a permanent failure of the video or the provider that waits for the user;
        `extractor_breakage` is the pinned yt-dlp being broken upstream, which the Owner clears by
        updating the pin (ADR 0009). The UI must never blame the video for the second.
      enum: [input, extractor_breakage]
    Language:
      type: string
      enum: [en, hi, hinglish]
    TranscriptSourceKind:
      type: string
      enum: [caption_human, caption_automatic, stt]
    RevisionOrigin:
      type: string
      enum: [generated, manual, conflict, restore]
    Provenance:
      type: string
      enum: [ai, user_edited]
    Source:
      type: object
      description: The YouTube video a Note derives from. Fields after `canonical_url` are null until the `metadata` Stage has run.
      properties:
        video_id:
          $ref: "#/components/schemas/VideoId"
        canonical_url:
          type: string
          format: uri
        title:
          type: [string, "null"]
        channel_id:
          type: [string, "null"]
        channel_name:
          type: [string, "null"]
        duration_seconds:
          type: [integer, "null"]
          minimum: 0
        published_at:
          type: [string, "null"]
          format: date-time
        metadata_fetched_at:
          type: [string, "null"]
          format: date-time
      required:
        - video_id
        - canonical_url
        - title
        - channel_id
        - channel_name
        - duration_seconds
        - published_at
        - metadata_fetched_at
    StageError:
      type: object
      properties:
        code:
          type: string
          description: The classifier's `error_code`, for example `extractor_breakage`.
        message:
          type: string
          description: The failure reason spec 8.4 writes for a person.
        is_permanent:
          type: boolean
      required: [code, message, is_permanent]
    StageProgress:
      type: object
      properties:
        stage:
          $ref: "#/components/schemas/StageKind"
        status:
          $ref: "#/components/schemas/StageStatus"
        attempts:
          type: integer
          minimum: 0
          description: Attempts made so far in this run, at most 4.
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        last_error:
          oneOf:
            - $ref: "#/components/schemas/StageError"
            - type: "null"
      required: [stage, status, attempts, started_at, finished_at, last_error]
    CostHold:
      type: object
      properties:
        since:
          $ref: "#/components/schemas/Timestamp"
        estimate_usd:
          $ref: "#/components/schemas/Money"
      required: [since, estimate_usd]
    ProcessingStatus:
      type: object
      description: The current run. `processing_version` bumps on every Submission, Retry and Regeneration (ADR 0006).
      properties:
        version:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/ProcessingState"
        failure_stage:
          oneOf:
            - $ref: "#/components/schemas/StageKind"
            - type: "null"
        failure_kind:
          oneOf:
            - $ref: "#/components/schemas/FailureKind"
            - type: "null"
        cost_hold:
          oneOf:
            - $ref: "#/components/schemas/CostHold"
            - type: "null"
          description: Set while the run waits for cost confirmation. Orthogonal to `state`.
        cancel_requested:
          type: boolean
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageProgress"
          description: The five Stages of this run in pipeline order; a bypassed `transcribing` is `skipped`, not absent.
      required:
        [
          version,
          state,
          failure_stage,
          failure_kind,
          cost_hold,
          cancel_requested,
          stages,
        ]
    TopicRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
      required: [id, name]
    TagRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
      required: [id, name]
    NoteCard:
      type: object
      description: The list rendering of spec 5.4 step 2, plus what Today needs to draw a processing card. No thumbnail.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        source:
          $ref: "#/components/schemas/Source"
        saved_at:
          $ref: "#/components/schemas/Timestamp"
        processing:
          $ref: "#/components/schemas/ProcessingStatus"
        primary_topic:
          oneOf:
            - $ref: "#/components/schemas/TopicRef"
            - type: "null"
          description: Null only while processing or failed, or in Trash.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        summary_text:
          type: [string, "null"]
          description: The Active Revision's summary, for the two-line card. Null until ready.
        detected_language:
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
        transcript_source:
          oneOf:
            - $ref: "#/components/schemas/TranscriptSourceKind"
            - type: "null"
        active_revision_id:
          type: [string, "null"]
          format: uuid
        awaiting_decisions:
          type: integer
          minimum: 0
          description: Revisions off the live line waiting for the Owner (ADR 0004).
        trashed_at:
          type: [string, "null"]
          format: date-time
        purge_after:
          type: [string, "null"]
          format: date-time
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - source
        - saved_at
        - processing
        - primary_topic
        - tags
        - summary_text
        - detected_language
        - transcript_source
        - active_revision_id
        - awaiting_decisions
        - trashed_at
        - purge_after
        - created_at
        - updated_at
    NoteList:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteCard"
        next_cursor:
          type: [string, "null"]
        sync_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The server's current Sync cursor at the time of the read.
      required: [notes, next_cursor, sync_cursor]
    Takeaway:
      type: object
      properties:
        text:
          type: string
        updated_cursor:
          type: integer
          format: int64
          minimum: 0
          description: Compare-and-set token; 0 for a Takeaway never written.
        updated_at:
          type: [string, "null"]
          format: date-time
      required: [text, updated_cursor, updated_at]
    Position:
      type: object
      description: A diagram element's box. Seeded by the server when a Revision becomes Active (ADR 0011).
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
          minimum: 0
        h:
          type: number
          format: double
          minimum: 0
      required: [x, y, w, h]
    PositionMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Position"
      description: Keyed by element id. Keys that resolve to no element in the drawn Diagram are ignored by the renderer.
    DiagramLayout:
      type: object
      properties:
        positions:
          $ref: "#/components/schemas/PositionMap"
        updated_at:
          type: [string, "null"]
          format: date-time
      required: [positions, updated_at]
    AiRole:
      type: string
      enum: [transcription, note_generation, embeddings, visual_analysis]
    BillingMode:
      type: string
      enum: [sync, batch]
    UsageOutcome:
      type: string
      enum: [billed, no_charge, unknown]
    UnitMap:
      type: object
      additionalProperties:
        type: number
        format: double
        minimum: 0
      description: Unit name to quantity, per `docs/design/cost-tracking.md`. Open-ended by design.
    UsageCall:
      type: object
      description: One billable provider call from the ledger (ADR 0007).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/AiRole"
        provider:
          type: string
        model:
          type: string
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        processing_version:
          type: [integer, "null"]
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          type: [string, "null"]
          format: date-time
        outcome:
          oneOf:
            - $ref: "#/components/schemas/UsageOutcome"
            - type: "null"
          description: Null while the call is in flight.
        estimated_units:
          $ref: "#/components/schemas/UnitMap"
        reported_units:
          oneOf:
            - $ref: "#/components/schemas/UnitMap"
            - type: "null"
        unpriced_units:
          oneOf:
            - $ref: "#/components/schemas/UnitMap"
            - type: "null"
        charge_usd:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
      required:
        - id
        - role
        - provider
        - model
        - billing_mode
        - processing_version
        - started_at
        - finished_at
        - outcome
        - estimated_units
        - reported_units
        - unpriced_units
        - charge_usd
    NoteCost:
      type: object
      description: Spec 7.4's estimated and reported AI usage, priced at read time from the Note's ledger rows.
      properties:
        estimated_usd:
          $ref: "#/components/schemas/Money"
        reported_usd:
          $ref: "#/components/schemas/Money"
        incomplete:
          type: boolean
          description: True when any call is unknown, unpriced, or in flight, so the figure reads "at least".
        calls:
          type: array
          items:
            $ref: "#/components/schemas/UsageCall"
      required: [estimated_usd, reported_usd, incomplete, calls]
    RoleUsed:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AiRole"
        provider:
          type: string
        model:
          type: string
      required: [role, provider, model]
    RevisionSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        revision_number:
          type: integer
          minimum: 1
        origin:
          $ref: "#/components/schemas/RevisionOrigin"
        parent_revision_id:
          type: [string, "null"]
          format: uuid
        generation_instruction:
          type: [string, "null"]
        awaiting_decision_since:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean
        origin_device_session_id:
          type: [string, "null"]
          format: uuid
          description: The Device session whose mutation produced this Revision, while the mutation ledger still holds it.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - revision_number
        - origin
        - parent_revision_id
        - generation_instruction
        - awaiting_decision_since
        - is_active
        - origin_device_session_id
        - created_at
    Revision:
      allOf:
        - $ref: "#/components/schemas/RevisionSummary"
        - type: object
          properties:
            payload:
              $ref: "#/components/schemas/RevisionPayload"
          required: [payload]
    RevisionList:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/RevisionSummary"
      required: [revisions]
    Note:
      allOf:
        - $ref: "#/components/schemas/NoteCard"
        - type: object
          properties:
            active_revision:
              oneOf:
                - $ref: "#/components/schemas/Revision"
                - type: "null"
            pending_revisions:
              type: array
              items:
                $ref: "#/components/schemas/RevisionSummary"
              description: Revisions awaiting a decision, oldest first.
            takeaway:
              $ref: "#/components/schemas/Takeaway"
            layout:
              $ref: "#/components/schemas/DiagramLayout"
            cost:
              $ref: "#/components/schemas/NoteCost"
            roles_used:
              type: array
              items:
                $ref: "#/components/schemas/RoleUsed"
              description: Models and providers by Processing role, from the Note's ledger rows.
          required:
            [
              active_revision,
              pending_revisions,
              takeaway,
              layout,
              cost,
              roles_used,
            ]

    # -- the Revision payload: a structural mirror of the normative schemas ----
    SourceRef:
      type: object
      description: Grounding, not a timestamp link. A chunk and a character span within it.
      properties:
        chunk_id:
          $ref: "#/components/schemas/Uuid"
        char_start:
          type: integer
          minimum: 0
        char_end:
          type: integer
          minimum: 1
      required: [chunk_id, char_start, char_end]
      additionalProperties: false
    ContentBlock:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        text:
          type: string
          minLength: 1
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [id, text, provenance, source_refs]
      additionalProperties: false
    RevisionPayload:
      type: object
      description: |
        The stored content of one Revision (ADR 0002). `primary_topic` and `tags` are the generator's
        proposals at generation time and are kept as history; the Note's live Primary Topic and Tags
        are relational and live on `NoteCard`. The normative rules -- word and count ranges for
        generation, editing floors, the 12-visible and 24-total caps, tree structure, grounding --
        are enforced by the server's validator, not by this shape.
      properties:
        schema_version:
          type: integer
          enum: [1]
        detected_language:
          $ref: "#/components/schemas/Language"
        primary_topic:
          type: string
        tags:
          type: array
          items:
            type: string
        summary:
          $ref: "#/components/schemas/ContentBlock"
        key_points:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ContentBlock"
        important_details:
          type: array
          items:
            $ref: "#/components/schemas/ContentBlock"
        practical_actions:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ContentBlock"
        diagram:
          $ref: "#/components/schemas/Diagram"
      required:
        - schema_version
        - detected_language
        - primary_topic
        - tags
        - summary
        - key_points
        - important_details
        - practical_actions
        - diagram
      additionalProperties: false
    Diagram:
      description: Exactly one Diagram type per Revision. The normative contract is `docs/design/diagram.schema.json`.
      oneOf:
        - $ref: "#/components/schemas/MindMapDiagram"
        - $ref: "#/components/schemas/ProcessFlowDiagram"
        - $ref: "#/components/schemas/TimelineDiagram"
        - $ref: "#/components/schemas/ComparisonDiagram"
      discriminator:
        propertyName: type
        mapping:
          mind_map: "#/components/schemas/MindMapDiagram"
          process_flow: "#/components/schemas/ProcessFlowDiagram"
          timeline: "#/components/schemas/TimelineDiagram"
          comparison: "#/components/schemas/ComparisonDiagram"
    CollapsedGroup:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        anchor_id:
          $ref: "#/components/schemas/ElementId"
        member_ids:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ElementId"
        initially_collapsed:
          type: boolean
          enum: [true]
      required: [id, anchor_id, member_ids, initially_collapsed]
      additionalProperties: false
    GraphLayout:
      type: object
      description: Engine selection only; coordinates live in `DiagramLayout`.
      properties:
        engine:
          type: string
          enum: [layered, radial]
        direction:
          type: string
          enum: [TB, BT, LR, RL]
      required: [engine]
      additionalProperties: false
    LinearLayout:
      type: object
      properties:
        orientation:
          type: string
          enum: [horizontal, vertical]
      required: [orientation]
      additionalProperties: false
    MindMapNode:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
          description: Free text; exactly one node has kind `root`.
        group_id:
          $ref: "#/components/schemas/ElementId"
        initially_visible:
          type: boolean
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [id, label, kind, initially_visible, provenance, source_refs]
      additionalProperties: false
    OrderedNode:
      type: object
      description: A process-flow node or a timeline event.
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        group_id:
          $ref: "#/components/schemas/ElementId"
        initially_visible:
          type: boolean
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [id, label, order, initially_visible, provenance, source_refs]
      additionalProperties: false
    DiagramEdge:
      type: object
      description: Grounding fields are present exactly when the edge carries a label.
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        from:
          $ref: "#/components/schemas/ElementId"
        to:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [id, from, to]
      additionalProperties: false
    MindMapDiagram:
      type: object
      properties:
        schema_version:
          type: integer
          enum: [1]
        type:
          type: string
          enum: [mind_map]
        nodes:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/MindMapNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DiagramEdge"
        collapsed_groups:
          type: array
          items:
            $ref: "#/components/schemas/CollapsedGroup"
        layout:
          $ref: "#/components/schemas/GraphLayout"
      required: [schema_version, type, nodes, edges, collapsed_groups, layout]
      additionalProperties: false
    ProcessFlowDiagram:
      type: object
      properties:
        schema_version:
          type: integer
          enum: [1]
        type:
          type: string
          enum: [process_flow]
        nodes:
          type: array
          minItems: 2
          maxItems: 24
          items:
            $ref: "#/components/schemas/OrderedNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DiagramEdge"
        collapsed_groups:
          type: array
          items:
            $ref: "#/components/schemas/CollapsedGroup"
        layout:
          $ref: "#/components/schemas/GraphLayout"
      required: [schema_version, type, nodes, edges, collapsed_groups, layout]
      additionalProperties: false
    TimelineDiagram:
      type: object
      properties:
        schema_version:
          type: integer
          enum: [1]
        type:
          type: string
          enum: [timeline]
        events:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/OrderedNode"
        collapsed_groups:
          type: array
          items:
            $ref: "#/components/schemas/CollapsedGroup"
        layout:
          $ref: "#/components/schemas/LinearLayout"
      required: [schema_version, type, events, collapsed_groups, layout]
      additionalProperties: false
    ComparisonColumn:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [id, label, order, provenance, source_refs]
      additionalProperties: false
    ComparisonCell:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
      required: [text, provenance, source_refs]
      additionalProperties: false
    ComparisonRow:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        provenance:
          $ref: "#/components/schemas/Provenance"
        speaker_claim:
          type: boolean
          default: false
          description: Absent means false.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
        cells:
          type: object
          minProperties: 2
          maxProperties: 4
          additionalProperties:
            $ref: "#/components/schemas/ComparisonCell"
          description: Keyed by column id.
      required: [id, label, order, provenance, source_refs, cells]
      additionalProperties: false
    ComparisonDiagram:
      type: object
      properties:
        schema_version:
          type: integer
          enum: [1]
        type:
          type: string
          enum: [comparison]
        columns:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/ComparisonColumn"
        rows:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ComparisonRow"
      required: [schema_version, type, columns, rows]
      additionalProperties: false

    # -- mutations ------------------------------------------------------------
    BlockSection:
      type: string
      enum: [summary, key_points, important_details, practical_actions]
    ListSection:
      type: string
      enum: [key_points, important_details, practical_actions]
    Mutation:
      type: object
      description: The envelope of `docs/design/mutation-protocol.md`.
      properties:
        mutation_id:
          $ref: "#/components/schemas/Uuid"
        base_revision_id:
          $ref: "#/components/schemas/Uuid"
        ops:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/MutationOp"
      required: [mutation_id, base_revision_id, ops]
    MutationOp:
      description: The closed operation catalogue. Anything absent is not representable.
      oneOf:
        - $ref: "#/components/schemas/SetBlockTextOp"
        - $ref: "#/components/schemas/InsertBlockOp"
        - $ref: "#/components/schemas/DeleteBlockOp"
        - $ref: "#/components/schemas/ReorderBlocksOp"
        - $ref: "#/components/schemas/SetElementLabelOp"
        - $ref: "#/components/schemas/SetCellTextOp"
        - $ref: "#/components/schemas/DeleteElementOp"
        - $ref: "#/components/schemas/ReorderElementsOp"
      discriminator:
        propertyName: op
        mapping:
          set_block_text: "#/components/schemas/SetBlockTextOp"
          insert_block: "#/components/schemas/InsertBlockOp"
          delete_block: "#/components/schemas/DeleteBlockOp"
          reorder_blocks: "#/components/schemas/ReorderBlocksOp"
          set_element_label: "#/components/schemas/SetElementLabelOp"
          set_cell_text: "#/components/schemas/SetCellTextOp"
          delete_element: "#/components/schemas/DeleteElementOp"
          reorder_elements: "#/components/schemas/ReorderElementsOp"
    SetBlockTextOp:
      type: object
      properties:
        op:
          type: string
          enum: [set_block_text]
        section:
          $ref: "#/components/schemas/BlockSection"
        id:
          $ref: "#/components/schemas/ElementId"
          description: Required for a list section; omitted for `summary`.
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required: [op, section, text]
      additionalProperties: false
    InsertBlockOp:
      type: object
      properties:
        op:
          type: string
          enum: [insert_block]
        section:
          $ref: "#/components/schemas/ListSection"
        id:
          $ref: "#/components/schemas/ElementId"
          description: Client-minted, so a replay cannot duplicate the block.
        text:
          type: string
          minLength: 1
          maxLength: 4000
        after_id:
          oneOf:
            - $ref: "#/components/schemas/ElementId"
            - type: "null"
          description: Null inserts at the head of the list.
      required: [op, section, id, text, after_id]
      additionalProperties: false
    DeleteBlockOp:
      type: object
      properties:
        op:
          type: string
          enum: [delete_block]
        section:
          $ref: "#/components/schemas/ListSection"
        id:
          $ref: "#/components/schemas/ElementId"
      required: [op, section, id]
      additionalProperties: false
    ReorderBlocksOp:
      type: object
      properties:
        op:
          type: string
          enum: [reorder_blocks]
        section:
          $ref: "#/components/schemas/ListSection"
        ids:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ElementId"
          description: A full permutation of the section's ids.
      required: [op, section, ids]
      additionalProperties: false
    SetElementLabelOp:
      type: object
      description: A node, edge label, timeline event, comparison column or row.
      properties:
        op:
          type: string
          enum: [set_element_label]
        element_id:
          $ref: "#/components/schemas/ElementId"
        label:
          type: string
          minLength: 1
          maxLength: 500
      required: [op, element_id, label]
      additionalProperties: false
    SetCellTextOp:
      type: object
      properties:
        op:
          type: string
          enum: [set_cell_text]
        row_id:
          $ref: "#/components/schemas/ElementId"
        column_id:
          $ref: "#/components/schemas/ElementId"
        text:
          type: string
          minLength: 1
          maxLength: 1000
      required: [op, row_id, column_id, text]
      additionalProperties: false
    DeleteElementOp:
      type: object
      description: A node, timeline event, comparison column or row. Deleting a node takes its incident edges; a column takes its cells. The server cascades.
      properties:
        op:
          type: string
          enum: [delete_element]
        element_id:
          $ref: "#/components/schemas/ElementId"
      required: [op, element_id]
      additionalProperties: false
    ReorderElementsOp:
      type: object
      properties:
        op:
          type: string
          enum: [reorder_elements]
        collection:
          type: string
          enum: [events, rows, columns]
        ids:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ElementId"
          description: A full permutation of the collection's ids.
      required: [op, collection, ids]
      additionalProperties: false
    MutationOutcome:
      type: string
      enum: [applied, conflicted]
    MutationResult:
      type: object
      properties:
        mutation_id:
          $ref: "#/components/schemas/Uuid"
        outcome:
          $ref: "#/components/schemas/MutationOutcome"
        revision_id:
          $ref: "#/components/schemas/Uuid"
          description: The Revision written. On `conflicted`, the Conflict Revision.
        active_revision_id:
          $ref: "#/components/schemas/Uuid"
          description: On `conflicted`, what the client rolls back to. Always the Note's current pointer.
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
        replayed:
          type: boolean
          description: True when this response was served from the idempotency ledger.
      required:
        [
          mutation_id,
          outcome,
          revision_id,
          active_revision_id,
          sync_cursor,
          replayed,
        ]
    RevisionPointerResult:
      type: object
      properties:
        note_id:
          $ref: "#/components/schemas/Uuid"
        revision_id:
          $ref: "#/components/schemas/Uuid"
          description: The Revision acted on, or for restore the new `restore` Revision.
        active_revision_id:
          $ref: "#/components/schemas/Uuid"
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
      required: [note_id, revision_id, active_revision_id, sync_cursor]
    TakeawayWrite:
      type: object
      properties:
        mutation_id:
          $ref: "#/components/schemas/Uuid"
        text:
          type: string
          maxLength: 20000
        base_cursor:
          type: integer
          format: int64
          minimum: 0
      required: [mutation_id, text, base_cursor]
    TakeawayResult:
      type: object
      properties:
        takeaway:
          $ref: "#/components/schemas/Takeaway"
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
      required: [takeaway, sync_cursor]
    PrimaryTopicWrite:
      type: object
      description: Exactly one of `topic_id` or `name`.
      properties:
        mutation_id:
          $ref: "#/components/schemas/Uuid"
        topic_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [mutation_id]
    PrimaryTopicResult:
      type: object
      properties:
        primary_topic:
          $ref: "#/components/schemas/TopicRef"
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
      required: [primary_topic, sync_cursor]
    TagsWrite:
      type: object
      properties:
        mutation_id:
          $ref: "#/components/schemas/Uuid"
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 120
          description: The complete set of Tag names the Note should carry.
      required: [mutation_id, tags]
    NoteTagsResult:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
      required: [tags, sync_cursor]
    LayoutWrite:
      type: object
      properties:
        positions:
          $ref: "#/components/schemas/PositionMap"
      required: [positions]
    LayoutResult:
      type: object
      properties:
        layout:
          $ref: "#/components/schemas/DiagramLayout"
        sync_cursor:
          $ref: "#/components/schemas/SyncCursor"
      required: [layout, sync_cursor]
    RegenerateRequest:
      type: object
      properties:
        instruction:
          type: string
          maxLength: 500
          description: A short steer such as "simplify this".
    RunOutcome:
      type: string
      enum: [started, held]
    RunStartResult:
      type: object
      properties:
        outcome:
          $ref: "#/components/schemas/RunOutcome"
        processing_version:
          type: integer
          minimum: 1
        estimate_usd:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The projected charge, present when the gate ran synchronously.
        note:
          $ref: "#/components/schemas/NoteCard"
      required: [outcome, processing_version, estimate_usd, note]
    CostConfirmation:
      type: object
      properties:
        processing_version:
          type: integer
          minimum: 1
      required: [processing_version]
    CostConfirmationResult:
      type: object
      properties:
        processing_version:
          type: integer
          minimum: 1
        estimate_usd:
          $ref: "#/components/schemas/Money"
          description: Recomputed against the price set in force now.
        note:
          $ref: "#/components/schemas/NoteCard"
      required: [processing_version, estimate_usd, note]
    TranscriptChunk:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ordinal:
          type: integer
          minimum: 0
        char_start:
          type: integer
          minimum: 0
        char_end:
          type: integer
          minimum: 1
        token_count:
          type: integer
          minimum: 1
      required: [id, ordinal, char_start, char_end, token_count]
    Transcript:
      type: object
      properties:
        note_id:
          $ref: "#/components/schemas/Uuid"
        source_kind:
          $ref: "#/components/schemas/TranscriptSourceKind"
        language_code:
          type: string
        text:
          type: string
          description: The normalized Transcript in its original language and script.
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptChunk"
          description: Spans into `text`, in ordinal order, so Source refs resolve on the client.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required: [note_id, source_kind, language_code, text, chunks, created_at]

    # -- search ---------------------------------------------------------------
    SearchChildKind:
      type: string
      enum:
        - metadata
        - summary
        - key_point
        - diagram
        - takeaway
        - important_detail
        - practical_action
        - transcript_chunk
    SemanticUnavailableReason:
      type: string
      description: "`provider_error` is a fault; `soft_cap` is a budget the Owner chose; `rate_limited` is the `query_embedding` class refusing this one call while lexical results still return. Word all three differently."
      enum: [provider_error, soft_cap, rate_limited]
    Excerpt:
      type: object
      properties:
        chunk_id:
          $ref: "#/components/schemas/Uuid"
        text:
          type: string
          maxLength: 240
      required: [chunk_id, text]
    SearchResult:
      type: object
      properties:
        note:
          $ref: "#/components/schemas/NoteCard"
        score:
          type: number
          format: double
        matched_kinds:
          type: array
          items:
            $ref: "#/components/schemas/SearchChildKind"
          description: Which kinds of child matched, so the card can say why it surfaced.
        excerpts:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Excerpt"
          description: Present only for a Transcript-only match.
      required: [note, score, matched_kinds, excerpts]
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/SearchResult"
        next_cursor:
          type: [string, "null"]
        exhausted:
          type: boolean
          description: The candidate depth ran out; there is no deeper page to offer.
        semantic_unavailable:
          oneOf:
            - $ref: "#/components/schemas/SemanticUnavailableReason"
            - type: "null"
      required: [results, next_cursor, exhausted, semantic_unavailable]

    # -- topics and tags ------------------------------------------------------
    Topic:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        normalized_name:
          type: string
        note_count:
          type: integer
          minimum: 0
          description: Ready, non-Trash Notes filed under it.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, name, normalized_name, note_count, created_at, updated_at]
    TopicList:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
      required: [topics]
    TopicWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]
    TopicMerge:
      type: object
      properties:
        into_topic_id:
          $ref: "#/components/schemas/Uuid"
      required: [into_topic_id]
    Tag:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        normalized_name:
          type: string
        note_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required: [id, name, normalized_name, note_count, created_at, updated_at]
    TagList:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
      required: [tags]
    TagWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]

    # -- settings: AI roles ---------------------------------------------------
    AiRoleConfig:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AiRole"
        provider:
          type: string
        model:
          type: string
        endpoint:
          type: [string, "null"]
          description: Null means the provider's canonical base URL.
        request_options:
          type: object
          additionalProperties: true
        key_configured:
          type: boolean
        key_hint:
          type: [string, "null"]
          description: The last four characters of the stored key, and nothing more.
        verified_at:
          type: [string, "null"]
          format: date-time
        verification_error:
          type: [string, "null"]
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - role
        - provider
        - model
        - endpoint
        - request_options
        - key_configured
        - key_hint
        - verified_at
        - verification_error
        - updated_at
    AiRoleDefault:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AiRole"
        provider:
          type: string
        model:
          type: string
        request_options:
          type: object
          additionalProperties: true
        source_note:
          type: [string, "null"]
      required: [role, provider, model, request_options, source_note]
    AiSettings:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AiRoleConfig"
        blocking_submission:
          type: array
          items:
            $ref: "#/components/schemas/AiRole"
          description: Roles that must be configured before a Submission is accepted. Empty means the pipeline can reach ready.
        defaults:
          type: array
          items:
            $ref: "#/components/schemas/AiRoleDefault"
      required: [roles, blocking_submission, defaults]
    AiRoleWrite:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
        model:
          type: string
          minLength: 1
          maxLength: 128
        endpoint:
          type: [string, "null"]
          maxLength: 2048
        request_options:
          type: object
          additionalProperties: true
        api_key:
          type: string
          minLength: 1
          maxLength: 4096
          description: Write-only. Omit to keep the stored key.
      required: [provider, model]
    VerificationResult:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AiRole"
        verified_at:
          type: [string, "null"]
          format: date-time
        verification_error:
          type: [string, "null"]
        charged:
          type: boolean
          description: Whether the check was billable and wrote a ledger row.
      required: [role, verified_at, verification_error, charged]

    # -- settings: usage and cost --------------------------------------------
    ModelUsage:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AiRole"
        provider:
          type: string
        model:
          type: string
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        calls:
          type: integer
          minimum: 0
        charge_usd:
          $ref: "#/components/schemas/Money"
        reported_units:
          $ref: "#/components/schemas/UnitMap"
        unpriced_units:
          $ref: "#/components/schemas/UnitMap"
      required:
        [
          role,
          provider,
          model,
          billing_mode,
          calls,
          charge_usd,
          reported_units,
          unpriced_units,
        ]
    UnpricedModel:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
      required: [provider, model, billing_mode]
    MonthlyUsage:
      type: object
      properties:
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        charged_usd:
          $ref: "#/components/schemas/Money"
        billed_calls:
          type: integer
          minimum: 0
        unknown_calls:
          type: integer
          minimum: 0
        unpriced_calls:
          type: integer
          minimum: 0
        in_flight_calls:
          type: integer
          minimum: 0
        soft_cap_usd:
          $ref: "#/components/schemas/Money"
        cap_reached:
          type: boolean
        semantic_paused:
          type: boolean
          description: Query embeddings are paused for this month and no override is in force.
        held_notes:
          type: integer
          minimum: 0
        by_model:
          type: array
          items:
            $ref: "#/components/schemas/ModelUsage"
        unpriced_models:
          type: array
          items:
            $ref: "#/components/schemas/UnpricedModel"
          description: Models that reported units no price set covers. Settings asks for a price.
      required:
        - month
        - charged_usd
        - billed_calls
        - unknown_calls
        - unpriced_calls
        - in_flight_calls
        - soft_cap_usd
        - cap_reached
        - semantic_paused
        - held_notes
        - by_model
        - unpriced_models
    CostSettings:
      type: object
      properties:
        soft_cap_usd:
          $ref: "#/components/schemas/Money"
        semantic_override_month:
          type: [string, "null"]
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: The month for which semantic search was re-enabled past the cap, if any.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      required: [soft_cap_usd, semantic_override_month, updated_at]
    CostSettingsWrite:
      type: object
      properties:
        soft_cap_usd:
          $ref: "#/components/schemas/Money"
      required: [soft_cap_usd]
    PriceSet:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        provider:
          type: string
        model:
          type: string
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        effective_from:
          $ref: "#/components/schemas/Timestamp"
        unit_prices:
          $ref: "#/components/schemas/UnitMap"
          description: USD for one unit.
        source_note:
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        [
          id,
          provider,
          model,
          billing_mode,
          effective_from,
          unit_prices,
          source_note,
          created_at,
        ]
    PriceSetList:
      type: object
      properties:
        price_sets:
          type: array
          items:
            $ref: "#/components/schemas/PriceSet"
      required: [price_sets]
    PriceSetCreate:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
        model:
          type: string
          minLength: 1
          maxLength: 128
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        effective_from:
          $ref: "#/components/schemas/Timestamp"
          description: Defaults to now. May not be earlier than the latest existing version for the same model and mode.
        unit_prices:
          $ref: "#/components/schemas/UnitMap"
        source_note:
          type: string
          maxLength: 1000
      required: [provider, model, unit_prices]

    # -- settings: search index ----------------------------------------------
    SearchIndexState:
      type: object
      properties:
        active_embedding_model:
          type: string
        embedding_dimension:
          type: integer
          minimum: 1
        reindexing_into_model:
          type: [string, "null"]
        reindex_started_at:
          type: [string, "null"]
          format: date-time
        incomplete_notes:
          type: integer
          minimum: 0
          description: Notes still lacking a current vector under the incoming model. 0 when no reindex is in progress.
        children_needing_embedding:
          type: integer
          minimum: 0
          description: The embedding worker's backlog under the active model.
      required:
        - active_embedding_model
        - embedding_dimension
        - reindexing_into_model
        - reindex_started_at
        - incomplete_notes
        - children_needing_embedding
    ReindexRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
      required: [model]

    # -- settings: health -----------------------------------------------------
    HealthStatus:
      type: string
      description: "`unknown` is never stored; the reader computes it from a stale `checked_at`."
      enum: [ok, warn, alarm, unknown]
    HealthCheck:
      type: object
      properties:
        check_name:
          type: string
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: [string, "null"]
        observed:
          type: object
          additionalProperties: true
        cadence_seconds:
          type: integer
          minimum: 1
        checked_at:
          $ref: "#/components/schemas/Timestamp"
        last_ok_at:
          type: [string, "null"]
          format: date-time
        first_alarm_at:
          type: [string, "null"]
          format: date-time
        last_notified_at:
          type: [string, "null"]
          format: date-time
      required:
        - check_name
        - status
        - message
        - observed
        - cadence_seconds
        - checked_at
        - last_ok_at
        - first_alarm_at
        - last_notified_at
    BackupRepository:
      type: string
      enum: [local, offsite]
    RestoreDrill:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        completed_at:
          $ref: "#/components/schemas/Timestamp"
        repository:
          $ref: "#/components/schemas/BackupRepository"
        snapshot_id:
          type: string
        restore_seconds:
          type: integer
          minimum: 1
        key_recovery_verified:
          type: boolean
        postgres_version:
          type: string
        pgvector_version:
          type: string
        notes:
          type: [string, "null"]
      required:
        - id
        - completed_at
        - repository
        - snapshot_id
        - restore_seconds
        - key_recovery_verified
        - postgres_version
        - pgvector_version
        - notes
    RestoreDrillCreate:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/BackupRepository"
        snapshot_id:
          type: string
          minLength: 1
          maxLength: 64
        restore_seconds:
          type: integer
          minimum: 1
        key_recovery_verified:
          type: boolean
        postgres_version:
          type: string
          minLength: 1
          maxLength: 64
        pgvector_version:
          type: string
          minLength: 1
          maxLength: 64
        notes:
          type: string
          maxLength: 4000
      required:
        [
          repository,
          snapshot_id,
          restore_seconds,
          key_recovery_verified,
          postgres_version,
          pgvector_version,
        ]
    HealthReport:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        drills:
          type: array
          items:
            $ref: "#/components/schemas/RestoreDrill"
          description: Newest first.
        next_drill_repository:
          $ref: "#/components/schemas/BackupRepository"
          description: The drill alternates repositories (ADR 0009).
        blocked_by_tooling:
          type: integer
          minimum: 0
          description: Notes whose current run failed with extractor breakage.
        generated_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        [
          checks,
          drills,
          next_drill_repository,
          blocked_by_tooling,
          generated_at,
        ]
    RetryBlockedResult:
      type: object
      properties:
        retried:
          type: integer
          minimum: 0
        note_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
      required: [retried, note_ids]

    # -- events ---------------------------------------------------------------
    SyncEntityKind:
      type: string
      enum: [note, takeaway, topic, tag, diagram_layout]
    SyncChange:
      type: string
      enum: [created, updated, deleted]
    SyncEvent:
      type: object
      description: A `sync_events` row, verbatim. Durable and replayable by cursor.
      properties:
        cursor:
          $ref: "#/components/schemas/SyncCursor"
        entity_kind:
          $ref: "#/components/schemas/SyncEntityKind"
        entity_id:
          $ref: "#/components/schemas/Uuid"
        note_id:
          type: [string, "null"]
          format: uuid
          description: The parent Note for takeaway, tag and diagram_layout events.
        change:
          $ref: "#/components/schemas/SyncChange"
        origin_device_session_id:
          type: [string, "null"]
          format: uuid
          description: Null for server-initiated changes. A client drops echoes of its own writes after advancing the cursor.
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        [
          cursor,
          entity_kind,
          entity_id,
          note_id,
          change,
          origin_device_session_id,
          occurred_at,
        ]
    ProgressEvent:
      type: object
      description: Best-effort and uncursored. The UI must never derive a durable conclusion from one.
      properties:
        note_id:
          $ref: "#/components/schemas/Uuid"
        processing_version:
          type: integer
          minimum: 1
        processing_state:
          $ref: "#/components/schemas/ProcessingState"
        stage_kind:
          oneOf:
            - $ref: "#/components/schemas/StageKind"
            - type: "null"
        stage_status:
          oneOf:
            - $ref: "#/components/schemas/StageStatus"
            - type: "null"
        attempt:
          type: integer
          minimum: 0
      required:
        [
          note_id,
          processing_version,
          processing_state,
          stage_kind,
          stage_status,
          attempt,
        ]
    ResyncEvent:
      type: object
      properties:
        reason:
          type: string
          enum: [cursor_expired]
      required: [reason]
    RevokedEvent:
      type: object
      properties:
        reason:
          type: string
          enum: [session_revoked, session_expired]
      required: [reason]
    EventsSince:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncEvent"
        next_cursor:
          type: integer
          format: int64
          minimum: 0
          description: Pass this back on the next poll. Equals the request cursor when nothing changed.
        resync_required:
          type: boolean
      required: [events, next_cursor, resync_required]

    # -- push -----------------------------------------------------------------
    VapidPublicKey:
      type: object
      properties:
        public_key:
          type: string
          pattern: "^[A-Za-z0-9_-]{87}$"
          description: The uncompressed P-256 point, base64url, for `applicationServerKey`.
      required: [public_key]
    PushKeys:
      type: object
      properties:
        p256dh:
          type: string
          pattern: "^[A-Za-z0-9_-]+=*$"
          minLength: 86
          maxLength: 88
        auth:
          type: string
          pattern: "^[A-Za-z0-9_-]+=*$"
          minLength: 22
          maxLength: 24
      required: [p256dh, auth]
    PushSubscriptionWrite:
      type: object
      description: "`PushSubscription.toJSON()` plus the two switches."
      properties:
        endpoint:
          type: string
          format: uri
          minLength: 12
          maxLength: 2048
          pattern: "^https://"
        keys:
          $ref: "#/components/schemas/PushKeys"
        expiration_time:
          type: [string, "null"]
          format: date-time
        notes_enabled:
          type: boolean
          default: true
        ops_enabled:
          type: boolean
          default: true
        replaces_endpoint:
          type: string
          maxLength: 2048
          description: The previous endpoint on `pushsubscriptionchange`, so the row is swapped rather than duplicated.
      required: [endpoint, keys]
    PushSubscriptionUpdate:
      type: object
      properties:
        notes_enabled:
          type: boolean
        ops_enabled:
          type: boolean
      minProperties: 1
    PushSubscription:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        device_session_id:
          $ref: "#/components/schemas/Uuid"
        device_display_name:
          type: string
        endpoint:
          type: string
        expiration_time:
          type: [string, "null"]
          format: date-time
        notes_enabled:
          type: boolean
        ops_enabled:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_success_at:
          type: [string, "null"]
          format: date-time
        last_failure_at:
          type: [string, "null"]
          format: date-time
        consecutive_failures:
          type: integer
          minimum: 0
      required:
        - id
        - device_session_id
        - device_display_name
        - endpoint
        - expiration_time
        - notes_enabled
        - ops_enabled
        - created_at
        - last_success_at
        - last_failure_at
        - consecutive_failures
    PushSubscriptionList:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscription"
      required: [subscriptions]
