          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      x-error-codes: [invalid_request]
      responses:
        "200":
          description: A page of cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/noteId"
    get:
      tags: [notes]
      operationId: getNote

      x-rate-limit: read
      summary: Read a Note in full
      description: |
        Everything the note canvas needs in one round trip: card fields, the Active Revision with its
        payload, the Revisions awaiting a decision, the Takeaway, diagram positions, and the per-note
        cost summary spec 7.4 lists as metadata. The Transcript is not included; it is fetched only
        when explicitly opened.
      x-error-codes: [not_found]
      responses:
        "200":
          description: The Note.
