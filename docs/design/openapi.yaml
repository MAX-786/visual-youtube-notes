                $ref: "#/components/schemas/NoteCard"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/restore:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: restoreNote

      x-rate-limit: admin
      summary: Restore a Note from Trash
      x-error-codes: [not_found, note_not_trashed, csrf_rejected]
      responses:
        "200":
          description: Restored, with the state it had before deletion.
          content:
            application/json:
