                $ref: "#/components/schemas/NoteCard"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/purge:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: purgeNote

      x-rate-limit: admin
      summary: Purge a trashed Note now
      description: |
        The manual form of the hourly Purge: removes the Note and all dependent data. Its spend stays
        in the ledger (ADR 0007). Only a Note already in Trash can be purged.
      x-error-codes: [not_found, note_not_trashed, csrf_rejected]
      responses:
        "204":
          description: Purged.
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/retry:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: retryNote

      x-rate-limit: run
      summary: Retry a failed Note
      description: |
        Starts a new run (`processing_version + 1`) at the failed Stage, carrying earlier Stages'
        results forward (ADR 0006). When the retry starts at `generating` or later the Transcript is
        already in hand, so the Soft cap gate runs synchronously and may answer `held` (ADR 0007).
      x-error-codes:
        [
          not_found,
          note_not_failed,
          note_trashed,
          roles_unconfigured,
          run_in_flight,
          csrf_rejected,
        ]
      responses:
        "200":
          description: The run started, or is held for cost confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStartResult"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/regenerate:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: regenerateNote

      x-rate-limit: run
      summary: Regenerate from the Transcript
      description: |
        Records the Active Revision as the base and produces a new `generated` Revision from the
        Transcript and the optional instruction, never from edited text. The result activates only if
        the Note still points at that base; otherwise it waits for a decision (ADR 0004). One
        Regeneration in flight per Note. The cost gate runs synchronously here.
      x-error-codes:
        [
          not_found,
          note_not_ready,
          note_trashed,
          regeneration_in_flight,
          roles_unconfigured,
          csrf_rejected,
        ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRequest"
      responses:
        "200":
          description: The run started, or is held for cost confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStartResult"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/cost-confirmation:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: confirmNoteCost

      x-rate-limit: run
      summary: Confirm a held run's spend
      description: |
        Clears the hold on the named run, recomputes the estimate against the price set in force now,
        and enqueues the withheld Stage. One confirmation per run: a confirmed run that later fails
        and is retried is asked again (ADR 0007). The `processing_version` guards against confirming
        a run other than the one the Owner was shown.
      x-error-codes: [not_found, cost_hold_absent, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostConfirmation"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostConfirmationResult"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/mutations:
    parameters:
      - $ref: "#/components/parameters/noteId"
    post:
      tags: [notes]
      operationId: mutateNote

      x-rate-limit: mutation
      summary: Apply an operation set to the Active Revision
      description: |
        The mutation envelope of `docs/design/mutation-protocol.md`. Operations are applied in array
        order onto the exact `base_revision_id`; the result is one immutable Revision. If the base is
        still the Active Revision the outcome is `applied` and the pointer moves; if it is stale the
        outcome is `conflicted`, a Conflict Revision is written on the stale branch, and
        `active_revision_id` is what the client rolls back to and the base for the next queued entry.

        Refusals are errors, not outcomes: `note_trashed`, `note_not_ready`, `revision_not_active`
        (details carry `active_revision_id`), `note_purged` (drop the queue for this Note),
        `mutation_expired` (older than the thirty-day floor), and `validation_failed` (the applied
        result broke a structural invariant; details name the rule). Replaying a `mutation_id` returns
        the recorded response verbatim with `replayed: true`.
      x-error-codes:
        [
          not_found,
          note_purged,
          note_trashed,
          note_not_ready,
          revision_not_active,
          mutation_expired,
          validation_failed,
          invalid_request,
          csrf_rejected,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mutation"
      responses:
        "200":
          description: Applied or conflicted. Both wrote a Revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Error"

  /notes/{noteId}/revisions:
