          $ref: "#/components/responses/Error"
    delete:
      tags: [notes]
      operationId: trashNote

      x-rate-limit: admin
      summary: Move a Note to Trash
      description: |
        Trash for thirty days, restorable to its original Save time and Primary Topic. A Note still
        processing has its run cancelled first (ADR 0006); restoring it later brings it back `failed`
        rather than resuming, because resuming would spend money the Owner did not ask to spend.
      x-error-codes: [not_found, note_trashed, csrf_rejected]
      responses:
        "200":
          description: The Note as it now stands in Trash.
          content:
            application/json:
