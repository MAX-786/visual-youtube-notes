openapi: 3.1.0
info:
  title: Visual YouTube Notes API
  version: 1.0.0
  summary: The V1 contract between the Go API, the SvelteKit PWA, and the Chromium extension.
  description: |
    This document is the source of truth for the HTTP surface (ADR 0001, ADR 0015). The Go server
    is generated from it and validates every request against it; the TypeScript client is generated
    from it. Nothing about the wire shapes lives anywhere else.

    ## Conventions

    - **Mounting.** Every path here is served under the `/api` prefix (ADR 0008). Spec 13's resource
      boundaries are preserved beneath it.
    - **Transports.** The PWA authenticates with the `__Host-vyn_access` cookie and must send
      `X-CSRF-Token` on every non-GET request (ADR 0003). The extension authenticates with a bearer
      access token and may only call operations marked `x-extension-callable: true`, which are the
      operations the CORS allowlist admits. A request carrying both transports is rejected with
      `mixed_transport`.
    - **Errors.** Every non-2xx response is an `ErrorResponse`: one envelope, a closed set of typed
      `code` values, a human `message` that names the next available action (spec 15), and an
      optional `details` object whose keys are fixed per code. The `x-error-codes` extension on each
      operation lists the codes it can return beyond the transport-level ones every operation shares.
    - **Timestamps** are RFC 3339 UTC strings. **Money** is a decimal string in USD, never a float,
      because the ledger stores `numeric(16,10)` (ADR 0007). **Sync cursors** are 64-bit integers
      allocated in commit order (ADR 0004). **List cursors** are opaque strings.
    - **Revision payloads** travel as the structural mirror defined under `RevisionPayload`. The
      normative constraints (word and count ranges, tree structure, the 12-visible cap) stay in
      `docs/design/diagram.schema.json` and the semantic validator; the server applies them on every
      write. `docs/design/openapi.test.mjs` keeps the mirror and the normative schema in step.
    - **Live updates.** `GET /events` is documented here but excluded from Go code generation, since
      a Server-Sent Events stream needs per-frame flushing that a generated handler cannot provide.
      Its frame schemas are `SyncEvent`, `ProgressEvent`, `ResyncEvent`, and `RevokedEvent`.
    - **Rate limits.** Every operation names an `x-rate-limit` class; the classes and their values
      are declared once under `x-rate-limit-classes` and read by the API at boot (ADR 0016). A
      limited request answers `429` with code `rate_limited`, a `Retry-After` header, and the class
      in `details`; it can come from any operation, so it is not repeated per operation. Clients treat
      it as a pause, never a drop: the PWA drainer waits `Retry-After` and resends the same entry.
      Search is the one exception: past the `query_embedding` class it degrades to lexical results
      with `semantic_unavailable: rate_limited` rather than failing.
servers:
  - url: https://yt-track.mkhismkh.com/api
    description: Production origin. Caddy proxies `/api/*` to the API service (ADR 0008).
tags:
  - name: auth
    description: Owner login, cookie sessions, account, and Device session management (ADR 0003).
  - name: pairing
    description: Extension Pairing, extension token refresh, and extension logout (ADR 0003, ADR 0013).
  - name: submissions
    description: Creating Notes from YouTube URLs, with the five-second Undo (ADR 0006).
  - name: notes
    description: Notes, Revisions, mutations, Takeaways, topics, tags, layout, and Transcripts (ADR 0004).
  - name: search
    description: Hybrid search (ADR 0005).
  - name: topics
    description: Primary Topics and Tags.
  - name: exports
    description: PDF, Markdown ZIP, and the Library backup, all streamed (ADR 0011).
  - name: settings
    description: AI roles, usage, the Soft cap, price sets, the search index, and health (ADR 0007, ADR 0009, ADR 0010).
  - name: events
    description: The live-update stream and its polling fallback (ADR 0012).
  - name: push
    description: Web Push subscriptions (ADR 0014).
security:
  - cookieSession: []

x-rate-limit-classes:
  # Token buckets, read by the API at boot (ADR 0016). `key` is what a bucket is
  # partitioned by; every class also has a global bucket over all keys, which is
  # the guarantee. The per-key bucket is only a fair-share partition, because a
  # client that forges CF-Connecting-IP can escape it and nothing more.
  # `burst` is the bucket size and `refill_seconds` the seconds to regain one
  # token; `concurrency` caps in-flight requests where the cost is memory or a
  # scarce backend rather than a rate. Values are starting points chosen against
  # the usage envelope in the ADR, not measurements.
  login:
    key: ip
    burst: 10
    refill_seconds: 60
    global_burst: 30
    global_refill_seconds: 6
    concurrency: 2
    note: Argon2id at 64 MiB per verification is the resource being protected. Concurrency bounds memory; the buckets bound guessing.
  credential:
    key: session
    burst: 3
    refill_seconds: 300
    global_burst: 6
    global_refill_seconds: 60
    concurrency: 2
    note: A password change verifies the current password at the same Argon2id cost as a login.
  refresh:
    key: ip
    burst: 30
    refill_seconds: 2
    global_burst: 120
    global_refill_seconds: 1
    note: Legitimate use is one refresh per device per fifteen minutes. The limit exists for a client stuck in a refresh loop.
  pairing_request:
    key: ip
    burst: 5
    refill_seconds: 60
    global_burst: 20
    global_refill_seconds: 15
    note: Each request is a row that lives five minutes and is purged after a day.
  pairing_exchange:
    key: ip
    burst: 60
    refill_seconds: 1
    global_burst: 240
    global_refill_seconds: 1
    note: The extension polls exchange every two seconds for up to five minutes (ADR 0013). The limit must admit that, and does.
  submission:
    key: session
    burst: 20
    refill_seconds: 15
    global_burst: 40
    global_refill_seconds: 6
    note: Spec 15 job creation. A burst of twenty covers an offline holding pen draining; the refill bounds a client submitting in a loop.
  run:
    key: session
    burst: 5
    refill_seconds: 60
    global_burst: 10
    global_refill_seconds: 30
    note: Retry, Regeneration, cost confirmation and the bulk retry after a yt-dlp bump each start a run that will spend money.
  mutation:
    key: session
    burst: 300
    refill_seconds: 1
    global_burst: 600
    global_refill_seconds: 1
    note: Sized for the write-through queue (ADR 0012) draining an offline editing session as fast as the server answers. Past the burst the drainer is slowed to one per second, never refused for good.
  search:
    key: session
    burst: 30
    refill_seconds: 1
    global_burst: 60
    global_refill_seconds: 1
    note: The request itself. The query embedding inside it draws on query_embedding.
  query_embedding:
    key: session
    burst: 10
    refill_seconds: 2
    global_burst: 20
    global_refill_seconds: 1
    mode: degrade
    note: Consulted by the search handler before the embedding call, which costs money and a provider round trip. Over the limit the handler skips the embedding and answers lexically with semantic_unavailable rate_limited. It never answers 429.
  export:
    key: session
    burst: 3
    refill_seconds: 10
    global_burst: 3
    global_refill_seconds: 10
    concurrency: 1
    note: Gotenberg has one CPU and two gigabytes (ADR 0008). One render at a time; a second waits up to ten seconds before rate_limited.
  stream:
    key: session
    concurrency: 2
    global_concurrency: 10
    note: One EventSource per browser profile (ADR 0012), with room for the overlap of a reconnect. No bucket, since a stream is held rather than repeated.
  admin:
    key: session
    burst: 30
    refill_seconds: 2
    global_burst: 60
    global_refill_seconds: 1
    note: Settings, topic and tag, push, session and lifecycle writes. Owner-paced clicks.
  read:
    key: session
    burst: 300
    refill_seconds: 1
    global_burst: 600
    global_refill_seconds: 1
    note: Every read. A PWA boot is about a dozen calls and the polling fallback is six a minute.

paths:
  # ---------------------------------------------------------------------------
  # /auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      operationId: login

      x-rate-limit: login
      summary: Password login for the PWA
      description: |
        Creates a fresh Device session of kind `pwa` (ADR 0003: a new authentication never revives an
        old session). Sets `__Host-vyn_access` and `__Secure-vyn_refresh`, and returns the raw CSRF
        token, which the PWA keeps in memory only. Every credential failure -- unknown user, wrong
        password, revoked session -- answers the same `unauthenticated`.
      security: []
      x-error-codes: [unauthenticated, invalid_request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Cookies are set on this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession

      x-rate-limit: refresh
      summary: Rotate the PWA's Token family
      description: |
        Cookie transport only; the extension refreshes at `POST /pairing/refresh`. Consumes the
        refresh cookie atomically, rotates both cookies, advances the inactivity deadline by thirty
        days, and returns a new CSRF token. Presenting an already-consumed refresh token revokes the
        whole Device session with no grace window (ADR 0003), so the PWA serializes refresh with Web
        Locks. No request body.
      security: []
      x-error-codes: [unauthenticated]
      responses:
        "200":
          description: Rotated. Cookies are set on this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh/csrf:
    get:
      tags: [auth]
      operationId: recoverCsrfToken

      x-rate-limit: refresh
      summary: Recover the CSRF token after a reload
      description: |
        The CSRF token lives in memory and is never persisted (ADR 0012). This no-store endpoint
        authenticates with the refresh cookie alone and returns the session's raw token again.
      security: []
      x-error-codes: [unauthenticated]
      responses:
        "200":
          description: The current CSRF token.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        default:
          $ref: "#/components/responses/Error"

  /auth/refresh/logout:
    post:
      tags: [auth]
      operationId: logoutViaRefresh

      x-rate-limit: refresh
      summary: Sign out even after the access cookie has expired
      description: Revokes the calling Device session using the refresh cookie, and clears both cookies.
      security: []
      x-error-codes: [unauthenticated]
      responses:
        "204":
          description: Session revoked; cookies cleared.
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout

      x-rate-limit: admin
      summary: Sign out this PWA device
      description: Revokes the calling Device session with reason `signed_out` and clears both cookies.
      x-error-codes: [unauthenticated, csrf_rejected]
      responses:
        "204":
          description: Session revoked; cookies cleared.
        default:
          $ref: "#/components/responses/Error"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession

      x-rate-limit: read
      summary: The foreground session gate
      description: |
        Called by the PWA on every foreground while online (ADR 0012). A `200` reveals the cached
        library; a `401` clears it. Also the first-sign-in source of the current Sync cursor.
      x-error-codes: [unauthenticated]
      responses:
        "200":
          description: The session is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Error"

  /auth/account:
    get:
      tags: [auth]
      operationId: getAccount

      x-rate-limit: read
      summary: The Owner account
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [auth]
      operationId: updateAccount

      x-rate-limit: admin
      summary: Change display name or timezone
      description: |
        Changing the timezone changes how Save times group from now on. It never rewrites
        `billing_month` on historical spend (ADR 0007).
      x-error-codes: [invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"

  /auth/account/password:
    post:
      tags: [auth]
      operationId: changePassword

      x-rate-limit: credential
      summary: Change the password
      description: |
        Keeps the calling Device session, rotates both of its credentials (so the response carries
        new cookies and a new CSRF token), and revokes every other Device session with reason
        `password_changed` (ADR 0003).
      x-error-codes: [unauthenticated, invalid_request, csrf_rejected]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed; this session's credentials were rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        default:
          $ref: "#/components/responses/Error"

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions

      x-rate-limit: read
      summary: List live Device sessions
      description: PWA and extension sessions alike, for the Settings account page.
      responses:
        "200":
          description: Every unrevoked Device session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionList"
        default:
          $ref: "#/components/responses/Error"

  /auth/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    delete:
      tags: [auth]
      operationId: revokeSession

      x-rate-limit: admin
      summary: Revoke one Device session
      description: |
        Immediate for both tokens. Revoking an extension session drops that browser to unpaired on
        its next request; revoking a PWA session cascades to its push subscriptions (ADR 0014) and
        closes its event stream within one heartbeat (ADR 0012). Revoking the calling session is
        allowed and behaves like logout.
      x-error-codes: [not_found, csrf_rejected]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"

  /auth/sessions/revoke-all:
    post:
      tags: [auth]
      operationId: revokeAllSessions

      x-rate-limit: admin
      summary: Sign out all devices
      description: Revokes every Device session including the caller's, with reason `all_devices_revoked`.
      x-error-codes: [csrf_rejected]
      responses:
        "204":
          description: Every session revoked; the caller's cookies are cleared.
        default:
          $ref: "#/components/responses/Error"

  /auth/security-events:
    get:
      tags: [auth]
      operationId: listSecurityEvents
      x-rate-limit: read
      summary: Recent Security events
      description: |
        The credential-free record of rejected and administrative authentication activity
        (ADR 0003), newest first, retained ninety days. Rate limiting appears here as
        `rate_limited` with the class name in `reason_code`, written once per transition into the
        limited state rather than per refused request (ADR 0016).
      parameters:
        - $ref: "#/components/parameters/cursor"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      x-error-codes: [invalid_request]
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
        default:
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # /pairing -- the extension's authentication namespace
  # ---------------------------------------------------------------------------
  /pairing/requests:
    post:
      tags: [pairing]
      operationId: createPairingRequest

      x-rate-limit: pairing_request
      summary: Create a Pairing request (extension)
      description: |
        Unauthenticated, CORS-enabled for the allowlisted extension origin only. The extension sends
        the SHA-256 of a verifier it keeps locally; the server stores the challenge and answers with
        a public request id that lives exactly five minutes (ADR 0003). The extension then opens
        `approval_url` in the PWA.
      security: []
      x-extension-callable: true
      x-error-codes: [origin_rejected, invalid_request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequestCreate"
      responses:
        "201":
          description: Request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
        default:
          $ref: "#/components/responses/Error"

  /pairing/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/requestId"
    get:
      tags: [pairing]
      operationId: getPairingRequest

      x-rate-limit: read
      summary: Read a Pairing request for the approval page
      x-error-codes: [not_found]
      responses:
        "200":
          description: The request and its state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        default:
          $ref: "#/components/responses/Error"

  /pairing/requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/requestId"
    post:
      tags: [pairing]
      operationId: approvePairingRequest

      x-rate-limit: admin
      summary: Approve the named browser
      x-error-codes:
        [not_found, pairing_decided, pairing_expired, csrf_rejected]
      responses:
        "200":
          description: Approved. The extension's next exchange succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        default:
          $ref: "#/components/responses/Error"

  /pairing/requests/{requestId}/deny:
    parameters:
      - $ref: "#/components/parameters/requestId"
    post:
      tags: [pairing]
      operationId: denyPairingRequest

      x-rate-limit: admin
      summary: Deny a Pairing request
      description: Terminal. Records a `pairing_denied` security event.
      x-error-codes:
        [not_found, pairing_decided, pairing_expired, csrf_rejected]
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        default:
          $ref: "#/components/responses/Error"

  /pairing/exchange:
    post:
      tags: [pairing]
      operationId: exchangePairingVerifier

      x-rate-limit: pairing_exchange
      summary: Exchange the verifier for a Token family (extension)
      description: |
        Unauthenticated, CORS-enabled. The extension polls this every two seconds until the Owner
        decides (ADR 0013): `pairing_not_approved` means keep polling. Success atomically consumes
        the request, creates an extension Device session, and returns the only copy of its tokens.
        Origin mismatch, extension-id mismatch, wrong verifier, replay, and an already-consumed
        request all answer `pairing_rejected` so the endpoint is not an oracle.
      security: []
      x-extension-callable: true
      x-error-codes:
        [
          pairing_not_approved,
          pairing_expired,
          pairing_denied,
          pairing_rejected,
          origin_rejected,
          invalid_request,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingExchange"
      responses:
        "200":
          description: Paired. Store both tokens in `chrome.storage.local` and nowhere else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenGrant"
        default:
          $ref: "#/components/responses/Error"

  /pairing/refresh:
    post:
      tags: [pairing]
      operationId: refreshExtensionTokens

      x-rate-limit: refresh
      summary: Rotate the extension's Token family
      description: |
        Bearer transport only. The body carries the single-use refresh token; the response carries the
        replacement pair. Reuse of a consumed refresh token revokes the session (ADR 0003), which is
        why the extension runs every refresh under a `navigator.locks` lock (ADR 0013).
      security: []
      x-extension-callable: true
      x-error-codes: [unauthenticated, origin_rejected, invalid_request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokensRequest"
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenGrant"
        default:
          $ref: "#/components/responses/Error"

  /pairing/logout:
    post:
      tags: [pairing]
      operationId: logoutExtension

      x-rate-limit: admin
      summary: Unpair this browser
      description: Revokes the calling extension Device session. The extension clears its local storage afterwards, never before.
      security:
        - extensionBearer: []
      x-extension-callable: true
      x-error-codes: [unauthenticated, origin_rejected]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # /submissions
  # ---------------------------------------------------------------------------
  /submissions:
    post:
      tags: [submissions]
      operationId: createSubmission

      x-rate-limit: submission
      summary: Submit a YouTube URL
      description: |
        Accepts every URL form spec 8.1 admits and normalizes it to a Video ID; the server is the sole
        authority on eligibility. Exactly one of three outcomes comes back (ADR 0013):

        - `created` -- a Note and its first Stage job exist, the job is scheduled five seconds out, and
          `undo_until` says how long the Undo is worth trying (it is best-effort: the server decides
          by the job's state, never by the clock).
        - `duplicate` -- this Video ID already has a Note. Nothing was created; `note.processing`
          and `note.trashed_at` tell the client which of spec 8.1's four duplicate behaviours to
          offer.
        - `held` -- month-to-date spend already meets the Soft cap, so this run is certain to stop
          for cost confirmation. The Note and its free Stages are created exactly as for `created`;
          the hold itself is placed after `captions` with a real estimate (ADR 0007). No Undo is
          offered because the Owner has to visit the PWA anyway.

        Refused before anything is written when the roles the pipeline cannot reach `ready` without
        are unconfigured (`roles_unconfigured`, ADR 0010).
      security:
        - cookieSession: []
        - extensionBearer: []
      x-extension-callable: true
      x-error-codes:
        [
          url_unsupported,
          roles_unconfigured,
          invalid_request,
          csrf_rejected,
          origin_rejected,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "200":
          description: One of the three typed outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        default:
          $ref: "#/components/responses/Error"

  /submissions/{noteId}:
    parameters:
      - $ref: "#/components/parameters/noteId"
    delete:
      tags: [submissions]
      operationId: undoSubmission

      x-rate-limit: submission
      summary: Undo a Submission
      description: |
        A Submission has no row of its own; it is addressed by the Note it created. If the first
        Stage job is still scheduled the Note is hard-deleted and the result is `undone`; if work has
        begun the Note moves to Trash, the running Stage is cancelled, and the result is `trashed`
        (ADR 0006).
      security:
        - cookieSession: []
        - extensionBearer: []
      x-extension-callable: true
      x-error-codes: [not_found, csrf_rejected, origin_rejected]
      responses:
        "200":
          description: What happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        default:
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # /notes
  # ---------------------------------------------------------------------------
  /notes:
    get:
      tags: [notes]
      operationId: listNotes

      x-rate-limit: read
      summary: List Notes as cards
      description: |
        Ordered by Save time descending, then id ascending. Today groups the page by `saved_at` in the
        account timezone; `from` and `to` are dates in that timezone, inclusive. `trashed=true` is the
        Trash view and excludes everything else. The response also carries the server's current Sync
        cursor so a first sign-in can adopt it (ADR 0012).
      parameters:
        - name: from
          in: query
          description: Earliest Save date, inclusive, in the account timezone.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest Save date, inclusive, in the account timezone.
          schema:
            type: string
            format: date
        - name: topic_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: tag_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: channel_id
          in: query
          schema:
