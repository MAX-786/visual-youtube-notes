<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Notes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">VN</span>
      <div>
        <h1>Visual Notes</h1>
        <p class="eyebrow">YouTube capture</p>
      </div>
    </header>
    <main>
      <p id="status" class="status" aria-live="polite">Checking connection…</p>
      <div class="actions">
        <button id="pair" class="primary" type="button" hidden>
          Pair this browser
        </button>
        <button id="sign-out" type="button" hidden>Unpair browser</button>
        <a
          class="app-link"
          href="https://yt-track.mkhismkh.com"
          target="_blank"
          rel="noreferrer noopener"
          >Open Visual Notes <span aria-hidden="true">↗</span></a
        >
      </div>
    </main>
    <footer>
      Saves only when you ask.
      <a
        href="https://yt-track.mkhismkh.com/privacy"
        target="_blank"
        rel="noreferrer noopener"
        >Privacy</a
      >
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
